<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <title>Maison Nasser Luxury Commerce System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ink: #2a1f16;
        --deep: #22170f;
        --cream: #fbf5ea;
        --ivory: #fff8ec;
        --sand: #efe3cf;
        --line: #dfcfb2;
        --gold: #d8b86a;
        --gold-dark: #9b6b1f;
        --muted: #6b5739;
        --vh: 1vh;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea,
      a {
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      a {
        cursor: pointer;
      }

      img {
        display: block;
        max-width: 100%;
      }

      @keyframes heroDrift {
        from {
          transform: scale(1) translate3d(0, 0, 0);
        }
        to {
          transform: scale(1.08) translate3d(-1.5%, -1%, 0);
        }
      }

      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(34px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInSlow {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes softPop {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes liquidFloat {
        0% {
          transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
          border-radius: 42% 58% 62% 38% / 42% 40% 60% 58%;
        }
        50% {
          transform: translate3d(6vw, -4vh, 0) scale(1.14) rotate(16deg);
          border-radius: 58% 42% 38% 62% / 55% 65% 35% 45%;
        }
        100% {
          transform: translate3d(-4vw, 5vh, 0) scale(0.96) rotate(-10deg);
          border-radius: 48% 52% 66% 34% / 40% 58% 42% 60%;
        }
      }

      .hero-bg {
        animation: heroDrift 18s ease-in-out infinite alternate;
      }

      .rise-in {
        animation: riseIn 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .fade-in-slow {
        animation: fadeInSlow 1100ms ease both;
        animation-delay: 180ms;
      }

      .soft-pop {
        animation: softPop 800ms ease both;
        animation-delay: 360ms;
      }

      .liquid-field {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
        mix-blend-mode: screen;
      }

      .liquid-blob {
        position: absolute;
        width: clamp(180px, 24vw, 420px);
        aspect-ratio: 1;
        filter: blur(18px);
        opacity: 0.36;
        animation: liquidFloat 14s ease-in-out infinite alternate;
      }

      .liquid-blob.one {
        left: 4%;
        bottom: 12%;
        background: radial-gradient(circle at 35% 30%, #fff4c8, #d8b86a 42%, transparent 72%);
      }

      .liquid-blob.two {
        right: 8%;
        top: 16%;
        background: radial-gradient(circle at 40% 40%, #ffe8d7, #b76e79 38%, transparent 74%);
        animation-delay: -5s;
      }

      .liquid-blob.three {
        right: 34%;
        bottom: -10%;
        background: radial-gradient(circle at 45% 38%, #fff8ec, #9b6b1f 42%, transparent 76%);
        animation-delay: -9s;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 0.72rem 1.1rem;
        color: var(--ivory);
        background: var(--ink);
        font-size: 0.9rem;
        font-weight: 800;
        text-decoration: none;
        transition: transform 240ms ease, filter 240ms ease, background 240ms ease, border 240ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.48;
        transform: none;
      }

      .btn-gold {
        color: var(--deep);
        background: linear-gradient(90deg, var(--gold-dark), var(--gold), #fff0ad);
      }

      .btn-light {
        color: var(--ink);
        background: var(--ivory);
      }

      .btn-ghost {
        color: var(--ink);
        border: 1px solid rgba(155, 107, 31, 0.38);
        background: transparent;
      }

      .btn-danger {
        background: #6e241f;
      }

      .language-btn {
        min-width: 92px;
      }

      .field,
      .select,
      .textarea {
        width: 100%;
        min-height: 44px;
        border: 1px solid #d9c8aa;
        border-radius: 1rem;
        outline: none;
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        padding: 0.8rem 0.95rem;
        transition: border 200ms ease, box-shadow 200ms ease;
      }

      .textarea {
        min-height: 106px;
        resize: vertical;
      }

      .field:focus,
      .select:focus,
      .textarea:focus {
        border-color: var(--gold-dark);
        box-shadow: 0 0 0 4px rgba(216, 184, 106, 0.2);
      }

      .label {
        display: block;
        color: #8a6a30;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 1.65rem;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 14px 40px rgba(153, 112, 50, 0.08);
        padding: clamp(1rem, 2.3vw, 1.45rem);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid rgba(216, 184, 106, 0.45);
        border-radius: 999px;
        background: rgba(255, 248, 236, 0.78);
        color: #5a421e;
        padding: 0.4rem 0.7rem;
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: capitalize;
        backdrop-filter: blur(12px);
      }

      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 999px;
        background: #ef4444;
      }

      .dot.online {
        background: #10b981;
      }

      .dot.saving,
      .dot.loading {
        background: #f59e0b;
      }

      .hero {
        position: relative;
        min-height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
        background: var(--deep);
        color: var(--ivory);
      }

      .hero-bg,
      .hero-shade {
        position: absolute;
        inset: 0;
      }

      .hero-bg {
        background-position: center;
        background-size: cover;
      }

      .hero-shade {
        background: linear-gradient(90deg, rgba(29, 19, 13, 0.9), rgba(59, 43, 29, 0.48), rgba(241, 220, 169, 0.12));
      }

      .topbar {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: clamp(1rem, 2.5vw, 1.6rem) clamp(1rem, 4vw, 3rem);
      }

      .brand-button {
        border: 0;
        background: transparent;
        color: var(--ivory);
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .hero-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        min-height: calc(var(--vh, 1vh) * 82);
        padding: 3rem clamp(1rem, 4vw, 3rem) 5rem;
      }

      .hero-copy {
        max-width: 1000px;
      }

      .hero-title {
        margin: 0;
        color: #fff6df;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.7rem, 12vw, 8.8rem);
        font-weight: 650;
        line-height: 0.88;
        letter-spacing: 0.075em;
        text-transform: uppercase;
      }

      .hero-line {
        max-width: 720px;
        margin: 2rem 0 0;
        color: #f7ead2;
        font-size: clamp(1.55rem, 3.6vw, 3.2rem);
        line-height: 1.08;
      }

      .hero-text {
        max-width: 610px;
        margin: 1.25rem 0 0;
        color: #f2dec0;
        font-size: 1.05rem;
        line-height: 1.75;
      }

      .action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .home-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: clamp(1.7rem, 4vw, 3rem);
        max-width: 1380px;
        margin: 0 auto;
        padding: clamp(3.5rem, 7vw, 6rem) clamp(1rem, 4vw, 3rem);
      }

      .span-full,
      .span-wide,
      .span-compact,
      .span-half {
        grid-column: span 12;
      }

      .section-title {
        max-width: 680px;
        margin-bottom: 2rem;
      }

      .section-title h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .section-title p {
        margin: 1rem 0 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .filter-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-bottom: 2rem;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr));
        gap: 2rem;
      }

      .product-tile {
        border: 0;
        background: transparent;
        color: inherit;
        padding: 0;
        text-align: left;
      }

      .product-image {
        aspect-ratio: 4 / 5;
        overflow: hidden;
        border-radius: 1.75rem;
        background: var(--sand);
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 700ms ease;
      }

      .product-tile:hover img {
        transform: scale(1.055);
      }

      .product-name {
        margin: 0.5rem 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.55rem;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 0.88rem;
      }

      .price-row,
      .stock-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        margin-top: 0.85rem;
      }

      .price {
        color: var(--ink);
        font-size: 1.08rem;
        font-weight: 900;
      }

      .strike {
        color: #8f7c62;
        text-decoration: line-through;
      }

      .media-plane {
        overflow: hidden;
        border-radius: 1.8rem;
        background: var(--sand);
      }

      .media-plane img {
        width: 100%;
        height: min(52vw, 450px);
        object-fit: cover;
        transition: transform 700ms ease;
      }

      .media-plane:hover img {
        transform: scale(1.04);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: end;
        justify-content: center;
        background: rgba(29, 19, 13, 0.62);
        padding: 0.8rem;
        backdrop-filter: blur(10px);
      }

      .modal-box {
        width: min(1120px, 100%);
        max-height: 92vh;
        overflow: auto;
        border-radius: 1.8rem;
        background: var(--ivory);
        padding: clamp(1rem, 3vw, 2rem);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
      }

      .modal-grid {
        display: grid;
        gap: 2rem;
      }

      .admin-shell {
        display: grid;
        min-height: 100vh;
        background: #f6eddd;
      }

      .sidebar {
        display: none;
        background: #251b13;
        color: var(--ivory);
        padding: 1.5rem;
      }

      .admin-main {
        min-width: 0;
        padding: clamp(1rem, 3vw, 2rem);
      }

      .admin-head {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .nav-list,
      .tabs {
        display: flex;
        gap: 0.55rem;
      }

      .nav-list {
        flex-direction: column;
      }

      .tabs {
        overflow-x: auto;
        padding-bottom: 0.6rem;
      }

      .nav-btn {
        width: 100%;
        border: 0;
        border-radius: 1rem;
        background: transparent;
        color: #ead9bd;
        padding: 0.85rem 1rem;
        text-align: left;
        font-weight: 850;
      }

      .nav-btn.active {
        background: var(--ivory);
        color: var(--deep);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 1rem;
      }

      .two-grid,
      .three-grid,
      .form-grid {
        display: grid;
        gap: 1rem;
      }

      .item-list {
        display: grid;
        gap: 1rem;
      }

      .split-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      .pill {
        border-radius: 999px;
        background: #f4ead9;
        color: #5f4b31;
        padding: 0.45rem 0.75rem;
        font-size: 0.85rem;
        font-weight: 750;
      }

      .barcode-box {
        border-radius: 1.1rem;
        background: #fff;
        padding: 0.75rem;
      }

      .barcode {
        width: 100%;
        max-width: 240px;
        height: 74px;
      }

      .color-dot {
        display: inline-block;
        width: 1.2rem;
        height: 1.2rem;
        border: 1px solid #c9ad72;
        border-radius: 999px;
        vertical-align: middle;
      }

      .drag-list {
        display: grid;
        gap: 0.75rem;
      }

      .drag-item {
        touch-action: none;
        border: 1px solid rgba(216, 184, 106, 0.45);
        border-radius: 1.3rem;
        background: var(--ivory);
        padding: 1rem;
        transition: transform 200ms ease, border 200ms ease, box-shadow 200ms ease;
      }

      .drag-item.dragging {
        border-color: var(--gold-dark);
        box-shadow: 0 18px 48px rgba(153, 112, 50, 0.18);
        transform: scale(1.02);
      }

      .layout-preview {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 0.7rem;
      }

      .preview-block {
        min-height: 110px;
        border-radius: 1.3rem;
        background: linear-gradient(135deg, var(--ivory), #ead4aa);
        padding: 1rem;
      }

      .login-page {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at top, #fff3c4, var(--cream) 42%, #e9dac0);
        padding: 1rem;
      }

      .login-page .panel {
        position: relative;
        z-index: 2;
      }

      [dir="rtl"] body {
        font-family: Tahoma, Arial, ui-sans-serif, system-ui, sans-serif;
      }

      [dir="rtl"] .product-tile,
      [dir="rtl"] .nav-btn {
        text-align: right;
      }

      [dir="rtl"] .label,
      [dir="rtl"] .brand-button {
        letter-spacing: 0.06em;
      }

      .notice,
      .error,
      .success {
        border-radius: 1rem;
        padding: 0.8rem 0.95rem;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .notice {
        background: #f7ecd8;
        color: #5f4b31;
      }

      .error {
        background: #fff1f2;
        color: #9f1239;
      }

      .success {
        background: #ecfdf5;
        color: #065f46;
      }

      footer {
        border-top: 1px solid #e1d2b7;
        padding: 1.5rem clamp(1rem, 4vw, 3rem);
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (min-width: 720px) {
        .form-grid,
        .two-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .three-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .modal {
          align-items: center;
        }

        .modal-grid {
          grid-template-columns: 0.9fr 1.1fr;
        }

        .admin-head {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      @media (min-width: 1024px) {
        .span-wide {
          grid-column: span 8;
        }

        .span-compact {
          grid-column: span 4;
        }

        .span-half {
          grid-column: span 6;
        }

        .admin-shell {
          grid-template-columns: 280px minmax(0, 1fr);
        }

        .sidebar {
          display: block;
        }

        .tabs {
          display: none;
        }

        .two-wide {
          grid-template-columns: 1.25fr 0.75fr;
        }
      }

      @media (max-width: 560px) {
        .topbar {
          align-items: flex-start;
        }

        .topbar .status {
          display: none;
        }

        .hero-title {
          font-size: 3.15rem;
        }

        .action-row .btn {
          width: 100%;
        }
      }
    </style>
  </head>

      function firebaseUrl(path) {
        const clean = String(path || "").replace(/^\/+|\/+$/g, "");
        return clean ? `${FIREBASE_URL}/${clean}.json` : `${FIREBASE_URL}/.json`;
      }

      async function api(path, options = {}) {
        const response = await fetch(firebaseUrl(path), {
          ...options,
          headers: { "Content-Type": "application/json", ...(options.headers || {}) }
        });
        if (!response.ok) {
          throw new Error((await response.text()) || `Firebase request failed: ${response.status}`);
        }
        return response.json();
      }

      function setStatus(patch, shouldRender = true) {
        state.status = { ...state.status, ...patch };
        if (shouldRender) render();
      }

      function listFromFirebase(node, fallback) {
        if (!node) return JSON.parse(JSON.stringify(fallback));
        if (Array.isArray(node)) return node.filter(Boolean);
        if (typeof node !== "object") return JSON.parse(JSON.stringify(fallback));
        const list = Object.entries(node).flatMap(([key, value]) => {
          if (!value || typeof value !== "object") return [];
          return [{ ...value, id: value.id || key }];
        });
        return list.length ? list : JSON.parse(JSON.stringify(fallback));
      }

      function normalizeData(raw) {
        const data = raw && typeof raw === "object" ? raw : {};
        return {
          categories: listFromFirebase(data.categories, seedData.categories).map((category) => ({
            ...category,
            subcategories: Array.isArray(category.subcategories) ? category.subcategories : []
          })),
          products: listFromFirebase(data.products, seedData.products).map((product) => ({
            ...product,
            promoPrice: product.promoPrice ? Number(product.promoPrice) : null,
            basePrice: Number(product.basePrice) || 0,
            internalStock: Number(product.internalStock) || 0,
            marketingThreshold: Number(product.marketingThreshold) || 1,
            colors: Array.isArray(product.colors) ? product.colors : []
          })),
          customers: listFromFirebase(data.customers, seedData.customers).map((customer) => ({
            ...customer,
            phones: Array.isArray(customer.phones) ? customer.phones : [],
            addresses: Array.isArray(customer.addresses) ? customer.addresses : []
          })),
          orders: listFromFirebase(data.orders, seedData.orders),
          discountCodes: listFromFirebase(data.discountCodes, seedData.discountCodes).map((discount) => ({
            ...discount,
            percent: Number(discount.percent) || 0,
            usageLimit: Number(discount.usageLimit) || 0,
            used: Number(discount.used) || 0,
            active: Boolean(discount.active)
          })),
          admins: listFromFirebase(data.admins, seedData.admins),
          layout: normalizeLayout(data.layout)
        };
      }

      function normalizeLayout(layout) {
        if (!layout || !Array.isArray(layout.sections)) return JSON.parse(JSON.stringify(seedLayout));
        const valid = new Set(seedLayout.sections.map((section) => section.id));
        const sections = layout.sections
          .filter((section) => valid.has(section.id))
          .map((section) => ({ ...seedLayout.sections.find((item) => item.id === section.id), ...section }));
        seedLayout.sections.forEach((section) => {
          if (!sections.some((item) => item.id === section.id)) sections.push({ ...section });
        });
        return { heroImage: layout.heroImage || HERO_IMAGE, sections };
      }

      function recordFromArray(items) {
        return items.reduce((record, item) => {
          record[item.id] = item;
          return record;
        }, {});
      }

      function seedPatch(raw) {
        const source = raw && typeof raw === "object" ? raw : {};
        const patch = {};
        ["categories", "products", "customers", "orders", "discountCodes", "admins"].forEach((key) => {
          if (!(key in source)) patch[key] = recordFromArray(seedData[key]);
        });
        if (!("layout" in source)) patch.layout = seedData.layout;
        return patch;
      }

      async function loadData(silent = false) {
        if (!silent) setStatus({ phase: "loading", message: "Reading Firebase data" });
        try {
          const raw = await api("");
          state.data = normalizeData(raw);
          const patch = seedPatch(raw);
          if (Object.keys(patch).length) {
            await api("", { method: "PATCH", body: JSON.stringify(patch) });
          }
          setStatus({ phase: "online", message: "Connected to Firebase Realtime Database", lastSync: new Date().toLocaleTimeString() });
          await enforceAutomations();
        } catch (error) {
          setStatus({ phase: "offline", message: error.message || "Firebase connection failed" });
        }
      }

      function upsert(items, item) {
        return items.some((current) => current.id === item.id) ? items.map((current) => (current.id === item.id ? item : current)) : [item, ...items];
      }

      async function saveItem(collection, item) {
        state.data[collection] = upsert(state.data[collection], item);
        setStatus({ phase: "saving", message: "Saving to Firebase" });
        try {
          await api(`${collection}/${item.id}`, { method: "PUT", body: JSON.stringify(item) });
          setStatus({ phase: "online", message: "Saved to Firebase", lastSync: new Date().toLocaleTimeString() });
        } catch (error) {
          setStatus({ phase: "offline", message: error.message || "Save failed" });
        }
      }

      async function deleteItem(collection, id) {
        state.data[collection] = state.data[collection].filter((item) => item.id !== id);
        setStatus({ phase: "saving", message: "Deleting from Firebase" });
        try {
          await api(`${collection}/${id}`, { method: "DELETE" });
          setStatus({ phase: "online", message: "Deleted from Firebase", lastSync: new Date().toLocaleTimeString() });
        } catch (error) {
          setStatus({ phase: "offline", message: error.message || "Delete failed" });
        }
      }

      async function saveLayout(layout) {
        state.data.layout = layout;
        setStatus({ phase: "saving", message: "Saving homepage layout" });
        try {
          await api("layout", { method: "PUT", body: JSON.stringify(layout) });
          setStatus({ phase: "online", message: "Homepage layout saved", lastSync: new Date().toLocaleTimeString() });
        } catch (error) {
          setStatus({ phase: "offline", message: error.message || "Layout save failed" });
        }
      }

      async function enforceAutomations() {
        const now = Date.now();
        const expiredProducts = state.data.products.filter((product) => product.promoPrice && product.offerEndsAt && new Date(product.offerEndsAt).getTime() <= now);
        for (const product of expiredProducts) {
          const updated = { ...product, promoPrice: null, offerEndsAt: null };
          state.data.products = upsert(state.data.products, updated);
          await api(`products/${updated.id}`, { method: "PUT", body: JSON.stringify(updated) });
        }

        const depletedCodes = state.data.discountCodes.filter((discount) => discount.active && discount.used >= discount.usageLimit);
        for (const discount of depletedCodes) {
          const updated = { ...discount, active: false };
          state.data.discountCodes = upsert(state.data.discountCodes, updated);
          await api(`discountCodes/${updated.id}`, { method: "PUT", body: JSON.stringify(updated) });
        }
      }

      function priceInfo(product) {
        const end = product.offerEndsAt ? new Date(product.offerEndsAt).getTime() : 0;
        const isOffer = Boolean(product.promoPrice && product.promoPrice < product.basePrice && end > Date.now());
        return { price: isOffer ? product.promoPrice : product.basePrice, original: product.basePrice, isOffer, end };
      }

      function offerText(product) {
        if (!product.offerEndsAt) return copy("No timer", "بدون مؤقت");
        const distance = new Date(product.offerEndsAt).getTime() - Date.now();
        if (distance <= 0) return copy("Expired", "انتهى");
        const days = Math.floor(distance / DAY_MS);
        const hours = Math.floor((distance % DAY_MS) / (60 * 60 * 1000));
        return days ? copy(`${days}d ${hours}h left`, `متبقي ${days} يوم و ${hours} ساعة`) : copy(`${hours}h left`, `متبقي ${hours} ساعة`);
      }

      function availability(product) {
        if (product.internalStock <= 0) return { soldOut: true, status: copy("Sold Out", "نفد المخزون"), marketing: copy("Sold Out", "نفد المخزون") };
        if (product.internalStock <= product.marketingThreshold) {
          return { soldOut: false, status: copy("Available", "متاح"), marketing: copy(`Only ${product.internalStock} pieces left`, `متبقي ${product.internalStock} قطع فقط`) };
        }
        return { soldOut: false, status: copy("Available", "متاح"), marketing: copy("In stock", "متوفر") };
      }

        const category = state.data.categories.find((item) => item.id === product.categoryId);

      function remainingUses(discount) {
        return Math.max(0, (Number(discount.usageLimit) || 0) - (Number(discount.used) || 0));

      function uniqueValues(values) {
        return Array.from(new Set(values.map((value) => String(value || "").trim()).filter(Boolean)));

      function splitValues(value) {
        return uniqueValues(String(value || "").split(/[\n,;]+/));

      function generateBarcode(categoryId, productName) {
        const cat = String(categoryId || "lux").replace(/[^a-z0-9]/gi, "").slice(0, 3).toUpperCase() || "LUX";

        return `MN-${cat}-${name}-${Date.now().toString().slice(-6)}`;
      }

      async function sha256(text) {
        if (!crypto.subtle) return `fallback:${btoa(text)}`;
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(digest)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
      }

        ["discounts", "Discounts"],
        ["admins", "Sub-admins"],

      function renderAdmin() {
        return `

              <nav class="nav-list">${tabs.map(([id, label]) => `<button class="nav-btn ${state.tab === id ? "active" : ""}" data-action="tab" data-tab="${id}">${tabLabel(id, label)}</button>`).join("")}</nav>

      function renderAdminTab() {
        if (state.tab === "categories") return renderCategoriesPanel();
        if (state.tab === "products") return renderProductsPanel();
        if (state.tab === "inventory") return renderInventoryPanel();
        if (state.tab === "orders") return renderOrdersPanel();
        if (state.tab === "customers") return renderCustomersPanel();
        if (state.tab === "discounts") return renderDiscountsPanel();
        if (state.tab === "admins") return renderAdminsPanel();
        if (state.tab === "layout") return renderLayoutPanel();
        if (state.tab === "sync") return renderSyncPanel();
        return renderOverviewPanel();

      function renderOverviewPanel() {
        const revenue = state.data.orders.reduce((sum, order) => sum + (Number(order.total) || 0), 0);
        const openOrders = state.data.orders.filter((order) => ["pending", "preparing"].includes(order.status)).length;
        const activeOffers = state.data.products.filter((product) => priceInfo(product).isOffer).length;
        const lowStock = state.data.products.filter((product) => product.internalStock > 0 && product.internalStock <= product.marketingThreshold).length;
        const metrics = [
          [copy("Revenue", "الإيرادات"), money(revenue), copy("From stored orders", "من الطلبات المسجلة")],
          [copy("Open orders", "طلبات مفتوحة"), openOrders, copy("Pending or preparing", "قيد الانتظار أو التجهيز")],
          [copy("Active offers", "عروض نشطة"), activeOffers, copy("Auto-expiring timers", "مؤقتات تنتهي تلقائيا")],
          [copy("Low stock", "مخزون منخفض"), lowStock, copy("At customer threshold", "عند حد الظهور للعميل")]
        ];
        return `<div class="item-list"><div class="metrics">${metrics.map(([label, value, note]) => `<div class="panel"><span class="label">${label}</span><h3 style="font-size:2rem;margin:0.7rem 0 0">${value}</h3><p class="muted small">${note}</p></div>`).join("")}</div><div class="panel"><h3 style="font-family:Georgia,serif;font-size:2rem;margin:0">${copy("Realtime operation map", "خريطة التشغيل المباشر")}</h3><div class="three-grid" style="margin-top:1rem"><p class="notice">${copy("Orders create or update customer profiles with multiple phones and addresses.", "الطلبات تنشئ أو تحدث ملفات العملاء مع عدة هواتف وعناوين.")}</p><p class="notice">${copy("Product stock is secret internally, while customer availability stays simplified.", "مخزون المنتج سري داخليا بينما تظهر حالة التوفر للعميل ببساطة.")}</p><p class="notice">${copy("Sub-admins share operational access without exposing customer-facing credentials.", "المديرون الفرعيون يحصلون على صلاحيات تشغيل بدون كشف بيانات دخول العملاء.")}</p></div></div></div>`;
      }

                  <input class="field" name="name" placeholder="${copy("Add internal subcategory", "إضافة قسم داخلي")}" required>

                </form>
              </div>`).join("")}</div>
          </div>
        `;
      }

      function productFormProduct() {
        return state.data.products.find((product) => product.id === state.productEditId) || {
          id: "",
          name: "",
          image: "",
          categoryId: state.data.categories[0]?.id || "",
          subcategoryId: state.data.categories[0]?.subcategories?.[0]?.id || "",
          basePrice: "",
          promoPrice: "",
          offerEndsAt: null,
          internalStock: 1,
          marketingThreshold: 5,
          colors: [{ id: uid("color"), name: "Gold", hex: "#d8b86a", quantity: 1 }]
        };
      }

      function colorLines(product) {
        return (product.colors || []).map((color) => `${color.name}|${color.hex}|${color.quantity}`).join("\n");
      }

      function renderProductsPanel() {
        const product = productFormProduct();
        const subOptions = state.data.categories.flatMap((category) => (category.subcategories || []).map((sub) => ({ ...sub, categoryName: nameIn("categories", category), categoryId: category.id })));
        const days = product.offerEndsAt ? Math.max(1, Math.ceil((new Date(product.offerEndsAt).getTime() - Date.now()) / DAY_MS)) : 7;
        return `
          <div class="item-list">
            <form id="product-form" class="panel item-list">
              <div class="split-row"><div><span class="label">${copy("Product and offer editor", "محرر المنتجات والعروض")}</span><h3 style="font-family:Georgia,serif;font-size:2rem;margin:0.25rem 0 0">${product.id ? copy("Edit product", "تعديل المنتج") : copy("Add product", "إضافة منتج")}</h3></div>${product.id ? `<button type="button" class="btn btn-ghost" data-action="cancel-product-edit">${copy("Cancel edit", "إلغاء التعديل")}</button>` : ""}</div>

                <label><span class="label">${copy("Category", "القسم")}</span><select class="select" name="categoryId">${state.data.categories.map((category) => `<option value="${esc(category.id)}" ${category.id === product.categoryId ? "selected" : ""}>${esc(nameIn("categories", category))}</option>`).join("")}</select></label>
                <label><span class="label">${copy("Subcategory", "القسم الداخلي")}</span><select class="select" name="subcategoryId">${subOptions.map((sub) => `<option value="${esc(sub.id)}" ${sub.id === product.subcategoryId ? "selected" : ""}>${esc(sub.categoryName)} / ${esc(nameIn("subcategories", sub))}</option>`).join("")}</select></label>
                <label><span class="label">${copy("Base price", "السعر الأساسي")}</span><input class="field" type="number" min="0" name="basePrice" value="${esc(product.basePrice)}" required></label>

                <label><span class="label">${copy("Secret internal stock", "المخزون الداخلي السري")}</span><input class="field" type="number" min="0" name="internalStock" value="${esc(product.internalStock)}"></label>
                <label><span class="label">${copy("Customer threshold", "حد الظهور للعميل")}</span><input class="field" type="number" min="1" name="marketingThreshold" value="${esc(product.marketingThreshold)}"></label>
              </div>
              <label><span class="label">${copy("Colors and quantities, one per line: Name|#hex|quantity", "الألوان والكميات، كل سطر: الاسم|#hex|الكمية")}</span><textarea class="textarea" name="colors">${esc(colorLines(product))}</textarea></label>
              <button class="btn btn-gold" type="submit">${copy("Save product", "حفظ المنتج")}</button>
            </form>
            <div class="two-grid">${state.data.products.map((item) => {
              const p = priceInfo(item);
              return `<div class="panel"><div class="split-row"><div><span class="label">${esc(trail(item))}</span><h3 style="font-family:Georgia,serif;font-size:1.7rem;margin:0.25rem 0 0">${esc(productTitle(item))}</h3><p class="muted small">${money(p.price)} ${p.isOffer ? `${copy("offer", "عرض")}, ${esc(offerText(item))}` : copy("base price", "السعر الأساسي")}</p><p class="muted small" style="font-family:monospace">${esc(item.barcode)}</p></div><img src="${esc(item.image || HERO_IMAGE)}" alt="${esc(productTitle(item))}" style="width:96px;height:116px;border-radius:1.2rem;object-fit:cover"></div><div class="action-row"><button class="btn btn-ghost" data-action="edit-product" data-id="${esc(item.id)}">${copy("Edit", "تعديل")}</button><button class="btn btn-danger" data-action="delete" data-collection="products" data-id="${esc(item.id)}">${copy("Delete", "حذف")}</button></div></div>`;
            }).join("")}</div>
          </div>
        `;
      }

      function renderInventoryPanel() {
        return `<div class="item-list">${state.data.products.map((product) => {
          const a = availability(product);
          return `<div class="panel"><div class="two-grid two-wide"><div><span class="label">${esc(trail(product))}</span><h3 style="font-family:Georgia,serif;font-size:2rem;margin:0.25rem 0 0">${esc(productTitle(product))}</h3><p class="muted small">${copy("Customer display", "ما يظهر للعميل")}: ${esc(a.status)} / ${esc(a.marketing)}</p><div class="form-grid" style="margin-top:1rem"><label><span class="label">${copy("Secret internal inventory", "المخزون الداخلي السري")}</span><input class="field inventory-input" data-id="${esc(product.id)}" data-field="internalStock" type="number" min="0" value="${esc(product.internalStock)}"></label><label><span class="label">${copy("Marketing threshold", "الحد التسويقي")}</span><input class="field inventory-input" data-id="${esc(product.id)}" data-field="marketingThreshold" type="number" min="1" value="${esc(product.marketingThreshold)}"></label></div><div class="item-list" style="margin-top:1rem"><span class="label">${copy("Color-level quantities", "كميات كل لون")}</span>${product.colors.map((color) => `<label class="split-row"><span><span class="color-dot" style="background:${esc(color.hex)}"></span> ${esc(colorTitle(color))}</span><input class="field color-qty" style="max-width:130px" type="number" min="0" data-product="${esc(product.id)}" data-color="${esc(color.id)}" value="${esc(color.quantity)}"></label>`).join("")}</div></div><div><span class="label">${copy("Admin barcode", "باركود الإدارة")}</span><div class="barcode-box" style="margin-top:0.8rem">${barcodeSvg(product.barcode)}</div><p class="muted small">${copy("Hidden from customers. Used for fulfillment and operations.", "مخفي عن العملاء ويستخدم للتجهيز والعمليات.")}</p></div></div></div>`;
        }).join("")}</div>`;
      }

      function barcodeSvg(code) {
        let x = 8;
        const bars = String(code || "MN").split("").map((char, index) => {
          const width = (char.charCodeAt(0) % 4) + 1;
          const height = 42 + ((char.charCodeAt(0) + index) % 18);
          const rect = `<rect x="${x}" y="8" width="${width}" height="${height}" fill="#2a1f16"></rect>`;
          x += width + 2;
          return rect;
        }).join("");
        return `<svg class="barcode" viewBox="0 0 180 74" role="img" aria-label="Barcode ${esc(code)}"><rect width="180" height="74" rx="10" fill="#fff8ec"></rect>${bars}<text x="90" y="68" text-anchor="middle" font-size="8" fill="#6f5424" font-family="monospace">${esc(code)}</text></svg>`;
      }

        const statuses = ["pending", "preparing", "shipped", "completed", "cancelled"];
        const orders = [...state.data.orders].sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime());
        return `<div class="item-list">${orders.map((order) => {
          const product = state.data.products.find((item) => item.id === order.productId);

      function renderCustomersPanel() {
        return `
          <div class="item-list">
            <form id="customer-form" class="panel item-list">
              <span class="label">${copy("Customer management", "إدارة العملاء")}</span>
              <div class="form-grid">
                <input class="field" name="name" placeholder="${copy("Name", "الاسم")}" required>
                <input class="field" name="email" type="email" placeholder="${copy("Email", "البريد الإلكتروني")}" required>

      function parseColorLines(text) {
        const lines = String(text || "").split("\n").map((line) => line.trim()).filter(Boolean);
        const parsed = lines.map((line) => {
          const [name, hex, qty] = line.split("|").map((part) => part.trim());
          return { id: uid("color"), name: name || "Default", hex: /^#[0-9a-f]{6}$/i.test(hex) ? hex : "#d8b86a", quantity: Math.max(0, Number(qty) || 0) };
        });
        return parsed.length ? parsed : [{ id: uid("color"), name: "Gold", hex: "#d8b86a", quantity: 1 }];
      }

      async function placeOrder(form) {
        const product = state.data.products.find((item) => item.id === form.get("productId"));
        if (!product) throw new Error(copy("Product no longer exists.", "المنتج لم يعد موجودا."));
        const color = product.colors.find((item) => item.id === form.get("colorId")) || product.colors[0];
        if (!color) throw new Error(copy("Product color is unavailable.", "لون المنتج غير متاح."));
        const quantity = Math.max(1, Math.floor(Number(form.get("quantity")) || 1));
        const maxQty = Math.min(product.internalStock, color.quantity);
        if (quantity > maxQty) throw new Error(copy("Requested quantity is not available.", "الكمية المطلوبة غير متاحة."));
        const codeValue = String(form.get("discountCode") || "").trim().toUpperCase();
        const discount = codeValue ? state.data.discountCodes.find((item) => item.code.toUpperCase() === codeValue && item.active && remainingUses(item) > 0) : null;
        if (codeValue && !discount) throw new Error(copy("Discount code is inactive or fully used.", "كود الخصم غير مفعل أو تم استخدامه بالكامل."));

        const email = String(form.get("email") || "").trim();
        const existingCustomer = state.data.customers.find((customer) => customer.email.toLowerCase() === email.toLowerCase());
        const customer = existingCustomer
          ? {
              ...existingCustomer,
              name: String(form.get("customerName") || existingCustomer.name).trim(),
              phones: uniqueValues([...existingCustomer.phones, form.get("phone")]),
              addresses: uniqueValues([...existingCustomer.addresses, form.get("address")])
            }
          : {
              id: uid("cus"),
              name: String(form.get("customerName") || "").trim(),
              email,
              phones: uniqueValues([form.get("phone")]),
              addresses: uniqueValues([form.get("address")]),
              createdAt: nowIso()
            };
        const updatedProduct = {
          ...product,
          internalStock: Math.max(0, product.internalStock - quantity),
          colors: product.colors.map((item) => (item.id === color.id ? { ...item, quantity: Math.max(0, item.quantity - quantity) } : item))
        };
        const p = priceInfo(product);
        const subtotal = p.price * quantity;
        const discountAmount = discount ? Math.round((subtotal * discount.percent) / 100) : 0;
        const updatedDiscount = discount ? { ...discount, used: discount.used + 1, active: discount.used + 1 < discount.usageLimit } : null;
        const order = {
          id: uid("ord"),
          productId: product.id,
          productType: trail(product),
          productName: product.name,
          barcode: product.barcode,
          color: color.name,
          quantity,
          customerId: customer.id,
          customerName: customer.name,
          phone: String(form.get("phone") || "").trim(),
          address: String(form.get("address") || "").trim(),
          unitPrice: p.price,
          discountCode: updatedDiscount?.code || null,
          discountAmount,
          total: Math.max(0, subtotal - discountAmount),
          status: "pending",
          createdAt: nowIso()
        };

        state.data.products = upsert(state.data.products, updatedProduct);
        state.data.customers = upsert(state.data.customers, customer);
        state.data.orders = [order, ...state.data.orders];
        if (updatedDiscount) state.data.discountCodes = upsert(state.data.discountCodes, updatedDiscount);
        setStatus({ phase: "saving", message: "Writing order, stock, customer, and discount data" });
        const writes = [
          api(`products/${updatedProduct.id}`, { method: "PUT", body: JSON.stringify(updatedProduct) }),
          api(`customers/${customer.id}`, { method: "PUT", body: JSON.stringify(customer) }),
          api(`orders/${order.id}`, { method: "PUT", body: JSON.stringify(order) })
        ];
        if (updatedDiscount) writes.push(api(`discountCodes/${updatedDiscount.id}`, { method: "PUT", body: JSON.stringify(updatedDiscount) }));
        await Promise.all(writes);
        state.message = copy(
          `Order ${order.id} saved. Operations can view barcode, address, phone, color, and stock changes.`,
          `تم حفظ الطلب ${order.id}. يمكن للإدارة رؤية الباركود والعنوان والهاتف واللون وتغييرات المخزون.`
        );
        setStatus({ phase: "online", message: "Order saved and inventory updated", lastSync: new Date().toLocaleTimeString() });
      }

      function reorderSections(sections, activeId, overId) {
        const activeIndex = sections.findIndex((section) => section.id === activeId);
        const overIndex = sections.findIndex((section) => section.id === overId);
        if (activeIndex < 0 || overIndex < 0 || activeIndex === overIndex) return sections;
        const next = [...sections];
        const [moved] = next.splice(activeIndex, 1);
        next.splice(overIndex, 0, moved);
        return next;
      }

      function cycleSpan(id) {
        const order = ["full", "wide", "compact", "half"];
        const layout = state.data.layout;
        layout.sections = layout.sections.map((section) => section.id === id ? { ...section, span: order[(order.indexOf(section.span) + 1) % order.length] } : section);
        saveLayout({ ...layout });
      }

      async function handleSubmit(event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        event.preventDefault();
        const data = new FormData(form);
        state.message = "";

        if (form.id === "login-form") {
          const username = String(data.get("username") || "");
          const password = String(data.get("password") || "");
          if (isMainAdmin(username, password)) {
            state.session = { username: "Mohamed Nasser", role: "main" };
            state.view = "admin";
          } else {
            const hash = await sha256(password);
            const admin = state.data.admins.find((item) => item.username.toLowerCase() === username.trim().toLowerCase() && item.passwordHash === hash);
            if (admin) {
              state.session = { username: admin.username, role: "sub" };
              state.view = "admin";
            } else {
              state.message = copy("Invalid administrator credentials.", "بيانات دخول الإدارة غير صحيحة.");
            }
          }
          render();
          return;
        }

        if (form.id === "checkout-form") {
          try {
            await placeOrder(data);
          } catch (error) {
            state.message = `${copy("Error", "خطأ")}: ${error.message || copy("Could not place order.", "تعذر تنفيذ الطلب.")}`;
            render();
          }
          return;
        }

        if (form.id === "category-form") {
          await saveItem("categories", { id: uid("cat"), name: String(data.get("name") || "").trim(), subcategories: [] });
          return;
        }

        if (form.classList.contains("subcat-form")) {
          const category = state.data.categories.find((item) => item.id === form.dataset.category);
          if (category) {
            await saveItem("categories", { ...category, subcategories: [...category.subcategories, { id: uid("sub"), name: String(data.get("name") || "").trim() }] });
          }
          return;
        }

        if (form.id === "product-form") {
          const id = String(data.get("id") || "");
          const existing = state.data.products.find((item) => item.id === id);
          const promoPrice = String(data.get("promoPrice") || "").trim() ? Number(data.get("promoPrice")) || null : null;
          const subcategoryId = String(data.get("subcategoryId") || "");
          const product = {
            id: id || uid("prod"),
            name: String(data.get("name") || "").trim(),
            image: String(data.get("image") || "").trim() || HERO_IMAGE,
            categoryId: String(data.get("categoryId") || ""),
            subcategoryId,
            basePrice: Number(data.get("basePrice")) || 0,
            promoPrice,
            offerEndsAt: promoPrice ? new Date(Date.now() + (Number(data.get("offerDays")) || 7) * DAY_MS).toISOString() : null,
            internalStock: Math.max(0, Number(data.get("internalStock")) || 0),
            marketingThreshold: Math.max(1, Number(data.get("marketingThreshold")) || 1),
            barcode: existing?.barcode || generateBarcode(data.get("categoryId"), data.get("name")),
            colors: parseColorLines(data.get("colors")),
            createdAt: existing?.createdAt || nowIso()
          };
          await saveItem("products", product);
          state.productEditId = null;
          render();
          return;
        }

        if (form.id === "customer-form") {
          await saveItem("customers", {
            id: uid("cus"),
            name: String(data.get("name") || "").trim(),
            email: String(data.get("email") || "").trim(),
            phones: splitValues(data.get("phones")),
            addresses: splitValues(data.get("addresses")),
            createdAt: nowIso()
          });
          return;
        }

        if (form.classList.contains("customer-detail-form")) {
          const customer = state.data.customers.find((item) => item.id === form.dataset.id);
          const value = String(data.get("value") || "").trim();
          if (customer && value) {
            const updated = form.dataset.type === "phone" ? { ...customer, phones: uniqueValues([...customer.phones, value]) } : { ...customer, addresses: uniqueValues([...customer.addresses, value]) };
            await saveItem("customers", updated);
          }
          return;
        }

        if (form.id === "discount-form") {
          await saveItem("discountCodes", {
            id: uid("disc"),
            code: String(data.get("code") || "").trim().toUpperCase(),
            percent: Math.max(1, Math.min(90, Number(data.get("percent")) || 1)),
            usageLimit: Math.max(1, Number(data.get("usageLimit")) || 1),
            used: 0,
            active: true,
            createdAt: nowIso()
          });
          return;
        }

        if (form.id === "admin-form") {
          const username = String(data.get("username") || "").trim();
          const password = String(data.get("password") || "");
          if (!username || password.length < 6) {
            state.message = copy("Enter a username and a password of at least 6 characters.", "اكتب اسم مستخدم وكلمة مرور لا تقل عن 6 أحرف.");
            render();
            return;
          }
          if (state.data.admins.some((item) => item.username.toLowerCase() === username.toLowerCase())) {
            state.message = copy("A sub-admin with this username already exists.", "يوجد مدير فرعي بهذا الاسم بالفعل.");
            render();
            return;
          }
          await saveItem("admins", { id: uid("admin"), username, passwordHash: await sha256(password), createdAt: nowIso() });
          return;
        }

        if (form.id === "hero-form") {
          await saveLayout({ ...state.data.layout, heroImage: String(data.get("heroImage") || "").trim() || HERO_IMAGE });
        }
      }

      async function handleClick(event) {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "scroll-top") window.scrollTo({ top: 0, behavior: "smooth" });
        if (action === "toggle-language") {
          state.lang = state.lang === "ar" ? "en" : "ar";
          localStorage.setItem("mn-language", state.lang);
          render();
        }
        if (action === "open-admin") { state.view = "admin"; state.message = ""; render(); }
        if (action === "open-store") { state.view = "store"; state.message = ""; render(); }
        if (action === "logout") { state.session = null; state.message = ""; render(); }
        if (action === "filter") { state.categoryFilter = target.dataset.category || "all"; render(); }
        if (action === "select-product") { state.selectedProductId = target.dataset.product; state.message = ""; render(); }
        if (action === "close-modal") { state.selectedProductId = null; state.message = ""; render(); }
        if (action === "tab") { state.tab = target.dataset.tab || "overview"; state.message = ""; render(); }
        if (action === "refresh") await loadData(false);
        if (action === "delete") await deleteItem(target.dataset.collection, target.dataset.id);
        if (action === "edit-product") { state.productEditId = target.dataset.id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        if (action === "cancel-product-edit") { state.productEditId = null; render(); }
        if (action === "toggle-discount") {
          const discount = state.data.discountCodes.find((item) => item.id === target.dataset.id);
          if (discount && remainingUses(discount) > 0) await saveItem("discountCodes", { ...discount, active: !discount.active });
        }
        if (action === "cycle-span") cycleSpan(target.dataset.id);
        if (action === "layout-preset") {
          let sections = [...state.data.layout.sections];
          if (target.dataset.preset === "reverse") sections.reverse();
          if (target.dataset.preset === "twoTop") sections = sections.map((section, index) => ({ ...section, span: index < 2 ? "half" : "full" }));
          if (target.dataset.preset === "editorial") sections = sections.map((section, index) => ({ ...section, span: index % 2 === 0 ? "wide" : "compact" }));
          await saveLayout({ ...state.data.layout, sections });
        }
      }

      async function handleChange(event) {
        const target = event.target;
        if (target.classList.contains("order-status")) {
          const order = state.data.orders.find((item) => item.id === target.dataset.id);
          if (order) await saveItem("orders", { ...order, status: target.value });
        }
        if (target.classList.contains("inventory-input")) {
          const product = state.data.products.find((item) => item.id === target.dataset.id);
          if (product) await saveItem("products", { ...product, [target.dataset.field]: Math.max(target.dataset.field === "marketingThreshold" ? 1 : 0, Number(target.value) || 0) });
        }
        if (target.classList.contains("color-qty")) {
          const product = state.data.products.find((item) => item.id === target.dataset.product);
          if (product) await saveItem("products", { ...product, colors: product.colors.map((color) => color.id === target.dataset.color ? { ...color, quantity: Math.max(0, Number(target.value) || 0) } : color) });
        }
      }

      function handleDragStart(event) {
        const item = event.target.closest(".drag-item");
        if (!item) return;
        state.draggingSectionId = item.dataset.section;
        if (event.dataTransfer) event.dataTransfer.effectAllowed = "move";
        render();
      }

      async function handleDrop(event) {
        const item = event.target.closest(".drag-item");
        if (!item || !state.draggingSectionId) return;
        event.preventDefault();
        const sections = reorderSections(state.data.layout.sections, state.draggingSectionId, item.dataset.section);
        state.draggingSectionId = null;
        await saveLayout({ ...state.data.layout, sections });
      }

      function handleDragOver(event) {
        if (event.target.closest(".drag-item")) event.preventDefault();
      }

      function handlePointerDown(event) {
        const item = event.target.closest(".drag-item");
        if (item) {
          state.draggingSectionId = item.dataset.section;
          render();
        }
      }

      function handlePointerOver(event) {
        const item = event.target.closest(".drag-item");
        if (!item || !state.draggingSectionId || state.draggingSectionId === item.dataset.section) return;
        state.data.layout.sections = reorderSections(state.data.layout.sections, state.draggingSectionId, item.dataset.section);
        render();
      }

      async function endPointerDrag() {
        if (!state.draggingSectionId) return;
        state.draggingSectionId = null;
        await saveLayout({ ...state.data.layout });
      }

      app.addEventListener("submit", handleSubmit);
      app.addEventListener("click", handleClick);
      app.addEventListener("change", handleChange);
      app.addEventListener("dragstart", handleDragStart);
      app.addEventListener("dragover", handleDragOver);
      app.addEventListener("drop", handleDrop);
      app.addEventListener("pointerdown", handlePointerDown);
      app.addEventListener("pointerover", handlePointerOver);
      window.addEventListener("pointerup", endPointerDrag);
      window.addEventListener("resize", updateDevice);
      window.addEventListener("orientationchange", updateDevice);

      function subscribeRealtime() {
        if (!("EventSource" in window)) return;
        const source = new EventSource(firebaseUrl(""));
        const refresh = () => loadData(true);
        source.addEventListener("put", refresh);
        source.addEventListener("patch", refresh);
        source.onopen = () => setStatus({ realtime: true }, false);
        source.onerror = () => setStatus({ realtime: false }, false);
      }

      updateDevice();
      loadData(false);
      subscribeRealtime();
      setInterval(() => loadData(true), 30000);
      setInterval(enforceAutomations, 60000);
    </script>
  </body>
</html>
